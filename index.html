<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PW TV Player</title>
  <style>
    body, html { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #status { position: absolute; top: 20px; left: 20px; color: #0f0; font-family: monospace; font-size: 24px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; }
  </style>
  <script src="https://jsdelivr.net"></script>
</head>
<body>
  <div id="status">Waiting for stream URL from Firebase...</div>
  <video id="video" controls autoplay></video>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById("status").innerText = "Error: " + msg + " (Line " + line + ")";
    };

    var DB_URL = "https://firebasedatabase.app";
    var currentUrl = "";
    var video = document.getElementById("video");
    var statusEl = document.getElementById("status");

    function loadStream(url) {
      if (!url || url === currentUrl) return;
      currentUrl = url;
      statusEl.style.display = "block";
      statusEl.innerText = "URL received! Loading stream...";

      if (typeof Hls !== "undefined" && Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          statusEl.style.display = "none";
          video.play();
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          statusEl.innerText = "HLS Error: " + data.details;
        });
      } else {
        video.src = url;
        statusEl.style.display = "none";
        video.play();
      }
    }

    setInterval(function() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", DB_URL + "?t=" + Date.now(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          if (data && data.url) {
            loadStream(data.url);
          }
        }
      };
      xhr.send();
    }, 3000);
  </script>
</body>
</html>
